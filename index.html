    <script>
      (function() {
        var OrigWebSocket = window.WebSocket;
        if (!OrigWebSocket) return;
        
        function SafeWebSocket(url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1))) {
            var listeners = {};
            return {
              readyState: 1,
              OPEN: 1,
              CLOSED: 3,
              CONNECTING: 0,
              CLOSING: 2,
              addEventListener: function(event, fn) {
                listeners[event] = listeners[event] || [];
                listeners[event].push(fn);
                if (event === 'open') {
                  setTimeout(fn, 0);
                }
              },
              removeEventListener: function(event, fn) {
                if (listeners[event]) {
                  listeners[event] = listeners[event].filter(function(f) { return f !== fn; });
                }
              },
              dispatchEvent: function() { return true; },
              send: function() {},
              close: function() {
                this.readyState = 3;
                (listeners['close'] || []).forEach(function(fn) { fn({ type: 'close' }); });
              }
            };
          }
          return new OrigWebSocket(url, protocols);
        }
        
        SafeWebSocket.prototype = OrigWebSocket.prototype;
        SafeWebSocket.OPEN = OrigWebSocket.OPEN;
        SafeWebSocket.CLOSED = OrigWebSocket.CLOSED;
        SafeWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
        SafeWebSocket.CLOSING = OrigWebSocket.CLOSING;
        window.WebSocket = SafeWebSocket;

        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>

  </body>
